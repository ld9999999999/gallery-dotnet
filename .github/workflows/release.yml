# Build self-contained Desktop and Web packages for Windows, Linux and macOS.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # .NET cross-publishes
          - os: ubuntu-latest
            rids: win-x64 linux-x64 linux-arm64
          # macOS is built on a Mac, code signing and notarization can be added here later.
          - os: macos-latest
            rids: osx-arm64 osx-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Needed to build the browser photo editor (Gallery.Develop.Wasm) into the Web package.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for rid in ${{ matrix.rids }}; do
            for app in Desktop Web; do
              name="Gallery.${app}-${VERSION}-${rid}"
              dotnet publish "src/Gallery.${app}" -c Release -r "$rid" --self-contained true \
                -p:Version="$VERSION" -o "publish/$name"
              # zip for Windows; tar.gz elsewhere so the executable bit is kept.
              if [[ "$rid" == win-* ]]; then
                (cd publish && zip -qr "../dist/$name.zip" "$name")
              else
                tar -czf "dist/$name.tar.gz" -C publish "$name"
              fi
            done
          done

      # XXX Code signing goes here later: codesign + notarytool on macOS, signtool or Azure Trusted Signing for Windows.

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Tags with a hyphen (v1.2.0-beta.1) are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
